name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker name (leave empty to use the name in wrangler.toml)'
        required: false
        type: string
      deploy_account_2:
        description: 'Also deploy to Cloudflare account #2'
        required: false
        type: boolean
        default: false
      deploy_account_3:
        description: 'Also deploy to Cloudflare account #3'
        required: false
        type: boolean
        default: false
      deploy_account_4:
        description: 'Also deploy to Cloudflare account #4'
        required: false
        type: boolean
        default: false

jobs:
  account-1:
    name: Deploy - Account 1
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "::add-mask::${CF_API_TOKEN}"
          echo "::add-mask::${CF_ACCOUNT_ID}"

      - id: name
        run: |
          set -euo pipefail
          INPUT_NAME="${{ inputs.worker_name }}"
          TOML_NAME=$(grep '^name' wrangler.toml | head -1 | sed -E 's/name\s*=\s*"(.*)"/\1/')
          if [ -n "$INPUT_NAME" ]; then
            FINAL_NAME="$INPUT_NAME"
          else
            FINAL_NAME="$TOML_NAME"
          fi
          echo "worker_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - run: |
          sed -i "s/^name = .*/name = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml
          sed -i "s/^service = .*/service = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}

      - env:
          WORKER_NAME: ${{ steps.name.outputs.worker_name }}
        run: |
          set -euo pipefail
          set +x
          resp=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          ok=$(echo "$resp" | jq -r '.success')
          if [ "$ok" != "true" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          SUBDOMAIN=$(echo "$resp" | jq -r '.result.subdomain')
          if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "null" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          echo "URL: https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"

  account-2:
    name: Deploy - Account 2
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_account_2 == true }}
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
    steps:
      - uses: actions/checkout@v7

      - run: |
          echo "::add-mask::${CF_API_TOKEN}"
          echo "::add-mask::${CF_ACCOUNT_ID}"

      - id: name
        run: |
          set -euo pipefail
          INPUT_NAME="${{ inputs.worker_name }}"
          TOML_NAME=$(grep '^name' wrangler.toml | head -1 | sed -E 's/name\s*=\s*"(.*)"/\1/')
          if [ -n "$INPUT_NAME" ]; then
            FINAL_NAME="$INPUT_NAME"
          else
            FINAL_NAME="$TOML_NAME"
          fi
          echo "worker_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - run: |
          sed -i "s/^name = .*/name = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml
          sed -i "s/^service = .*/service = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml

      - uses: cloudflare/wrangler-action@v7
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}

      - env:
          WORKER_NAME: ${{ steps.name.outputs.worker_name }}
        run: |
          set -euo pipefail
          set +x
          resp=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          ok=$(echo "$resp" | jq -r '.success')
          if [ "$ok" != "true" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          SUBDOMAIN=$(echo "$resp" | jq -r '.result.subdomain')
          if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "null" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          echo "URL: https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"

  account-3:
    name: Deploy - Account 3
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_account_3 == true }}
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
    steps:
      - uses: actions/checkout@v7

      - run: |
          echo "::add-mask::${CF_API_TOKEN}"
          echo "::add-mask::${CF_ACCOUNT_ID}"

      - id: name
        run: |
          set -euo pipefail
          INPUT_NAME="${{ inputs.worker_name }}"
          TOML_NAME=$(grep '^name' wrangler.toml | head -1 | sed -E 's/name\s*=\s*"(.*)"/\1/')
          if [ -n "$INPUT_NAME" ]; then
            FINAL_NAME="$INPUT_NAME"
          else
            FINAL_NAME="$TOML_NAME"
          fi
          echo "worker_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - run: |
          sed -i "s/^name = .*/name = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml
          sed -i "s/^service = .*/service = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml

      - uses: cloudflare/wrangler-action@v7
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}

      - env:
          WORKER_NAME: ${{ steps.name.outputs.worker_name }}
        run: |
          set -euo pipefail
          set +x
          resp=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          ok=$(echo "$resp" | jq -r '.success')
          if [ "$ok" != "true" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          SUBDOMAIN=$(echo "$resp" | jq -r '.result.subdomain')
          if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "null" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          echo "URL: https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"

  account-4:
    name: Deploy - Account 4
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_account_4 == true }}
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_4 }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_4 }}
    steps:
      - uses: actions/checkout@v7

      - run: |
          echo "::add-mask::${CF_API_TOKEN}"
          echo "::add-mask::${CF_ACCOUNT_ID}"

      - id: name
        run: |
          set -euo pipefail
          INPUT_NAME="${{ inputs.worker_name }}"
          TOML_NAME=$(grep '^name' wrangler.toml | head -1 | sed -E 's/name\s*=\s*"(.*)"/\1/')
          if [ -n "$INPUT_NAME" ]; then
            FINAL_NAME="$INPUT_NAME"
          else
            FINAL_NAME="$TOML_NAME"
          fi
          echo "worker_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - run: |
          sed -i "s/^name = .*/name = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml
          sed -i "s/^service = .*/service = \"${{ steps.name.outputs.worker_name }}\"/" wrangler.toml

      - uses: cloudflare/wrangler-action@v7
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}

      - env:
          WORKER_NAME: ${{ steps.name.outputs.worker_name }}
        run: |
          set -euo pipefail
          set +x
          resp=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          ok=$(echo "$resp" | jq -r '.success')
          if [ "$ok" != "true" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          SUBDOMAIN=$(echo "$resp" | jq -r '.result.subdomain')
          if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "null" ]; then
            echo "Deployed as: ${WORKER_NAME}"
            exit 0
          fi
          echo "URL: https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
